[tool.ruff]
required-version = "==0.14.14"
target-version = "py311"
line-length = 100
extend-exclude = ["data", "models", "local_notes"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B007", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# CLI entry points add the repository root before importing application modules.
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
