name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit locked runtime dependencies
        run: python -m pip_audit --disable-pip --no-deps -r requirements.lock -r requirements-fallback.lock

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan repository history with redacted output
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
          --gitleaks-ignore-path /repo/.gitleaksignore
